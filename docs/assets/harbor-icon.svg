<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Harbor">
  <defs>
    <linearGradient id="bg" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="55%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#0B3B4A"/>
    </linearGradient>
    <linearGradient id="beam" x1="256" y1="88" x2="420" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)"/>

  <!-- Soft harbor water -->
  <path d="M72 368c48-28 96-28 144 0s96 28 144 0 96-28 144 0v72H72z" fill="#082F3A" opacity="0.55"/>
  <path d="M72 392c44-20 88-20 132 0s88 20 132 0 88-20 132 0" fill="none" stroke="#5EEAD4" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- Light beam -->
  <path d="M256 120 L420 168 L256 148 Z" fill="url(#beam)"/>

  <!-- Lighthouse tower -->
  <path d="M214 360 L230 168 H282 L298 360 Z" fill="#ECFEFF"/>
  <rect x="224" y="210" width="64" height="18" rx="4" fill="#0F766E" opacity="0.35"/>
  <rect x="220" y="258" width="72" height="18" rx="4" fill="#0F766E" opacity="0.28"/>
  <rect x="216" y="306" width="80" height="18" rx="4" fill="#0F766E" opacity="0.22"/>

  <!-- Lantern room -->
  <rect x="236" y="128" width="40" height="40" rx="8" fill="#FDE68A"/>
  <rect x="248" y="138" width="16" height="20" rx="3" fill="#F59E0B"/>
  <path d="M228 128 H284 L256 96 Z" fill="#F8FAFC"/>

  <!-- Three kanban columns as dock piles / board -->
  <g transform="translate(0,8)">
    <rect x="96" y="214" width="52" height="132" rx="14" fill="#99F6E4" opacity="0.92"/>
    <rect x="106" y="228" width="32" height="18" rx="5" fill="#0F766E" opacity="0.55"/>
    <rect x="106" y="256" width="32" height="18" rx="5" fill="#0F766E" opacity="0.4"/>
    <rect x="106" y="284" width="32" height="18" rx="5" fill="#0F766E" opacity="0.28"/>

    <rect x="364" y="214" width="52" height="132" rx="14" fill="#5EEAD4" opacity="0.88"/>
    <rect x="374" y="228" width="32" height="18" rx="5" fill="#0F766E" opacity="0.55"/>
    <rect x="374" y="256" width="32" height="18" rx="5" fill="#0F766E" opacity="0.4"/>
    <rect x="374" y="284" width="32" height="18" rx="5" fill="#0F766E" opacity="0.28"/>
  </g>
</svg>
